name: devops-delivery-lab

x-app: &app
  image: devops-delivery-lab:local
  build:
    context: .
    target: production
  environment:
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: ${POSTGRES_DB:-notes}
    PGUSER: ${POSTGRES_USER:-notes}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notes_test
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notes", "-d", "notes_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: "dbname=notes_test"
      PGHOST: test-db
      PGUSER: notes
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres-data:
